name: Compress and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version string for tag and release (ex: v1.0.0 or server-v1.0.0)'
        required: true
        type: string

permissions:
  contents: write # Required to push tags and create releases

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history so we can push tags

      - name: Create ZIP archive while excluding metadata
        run: |
          zip -r LetThemEatCake-${{ github.event.inputs.version }}.zip . \
            -x "README*" \
            -x ".git/*" \
            -x ".github/*"

      - name: Create tag
        run: |
          git tag ${{ github.event.inputs.version }}
          git push origin ${{ github.event.inputs.version }}

      - name: Create release and upload zip file
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.event.inputs.version }} \
            ./LetThemEatCake-${{ github.event.inputs.version }}.zip \
            --title "Let Them Eat Cake ${{ github.event.inputs.version }}" \
            --notes "Release ${{ github.event.inputs.version }}" \
            --target ${{ github.sha }}
